<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ 
            margin: 0;
            padding: 0;
        }
        h1{ 
            background-color: green;
            color: yellow;
            font-size: 40px;
            padding: 30px;
            text-align: center;
        }

        p{ 
            font-size: 30px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        label{ 
            font-size: 20px;
        }
        span{ 
            font-weight: bolder;
            margin-right: 10px;
        }

        #correct, #incorrect{ 
        display: none;
        }
        #modi:checked ~ #correct{ 
            display: block;
        }

        #rahul:checked ~ #incorrect, #ms-dhoni:checked ~ #incorrect, #virat:checked ~ #incorrect { 
            display: block;
        }

        #correct{ 
            margin-top: 20px;
            background-color: green;
            color: white;
            padding: 20px;
        }
        #incorrect{ 
            margin-top: 20px;
            background-color: red;
            color: white;
            padding: 20px;
        }

    </style>
</head>
<body>
    <h1>Quiz Application</h1>

    <p>Who is the Priminister of India?</p>
    <span>A.</span><input type="radio" id="rahul" name="pm">
    <label for="rahul">Rahul Gandhi</label> <br>
    <span>B.</span><input type="radio" id="modi" name="pm">
    <label for="modi">Modi Ji</label> <br>
    <span>C.</span><input type="radio" id="ms-dhoni" name="pm">
    <label for="ms-dhoni">Ms Dhoni</label> <br>
    <span>C.</span><input type="radio" id="virat" name="pm"> 
    <label for="virat">Mr Virat</label>

    <h3 id="correct">Correct! </h3>
    <h3 id="incorrect">Incorrect! Try Again! </h3>

</body>
</html>
